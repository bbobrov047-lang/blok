<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
    }
    .header { text-align: center; margin-bottom: 16px; }
    .icon { font-size: 40px; }
    h1 { font-size: 16px; color: #0d9488; margin-top: 8px; }
    .status { 
      background: #10b981; 
      color: white; 
      padding: 8px 16px; 
      border-radius: 8px; 
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }
    .blocked-list { margin-top: 16px; }
    .blocked-list h3 { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .site { 
      background: #f3f4f6; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 13px;
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🛡️</div>
    <h1>Focus Guard</h1>
  </div>
  <div class="status">✓ Защита активна</div>
  <div class="blocked-list">
    <h3>Заблокированные сайты:</h3>
    <div class="site">📺 YouTube</div>
    <div class="site">💬 Telegram Web</div>
    <div class="site">📱 WhatsApp Web</div>
  </div>
</body>
</html>
