<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт заблокирован</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d9488 0%, #0891b2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 500px; }
    .icon { font-size: 80px; margin-bottom: 24px; }
    h1 { font-size: 2rem; margin-bottom: 16px; font-weight: 600; }
    p { font-size: 1.1rem; opacity: 0.9; line-height: 1.6; }
    .sites { margin-top: 24px; padding: 16px; background: rgba(255,255,255,0.1); border-radius: 12px; }
    .sites h3 { font-size: 0.9rem; opacity: 0.8; margin-bottom: 12px; }
    .site { background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 8px; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <h1>Этот сайт заблокирован</h1>
    <p>Focus Guard защищает вас от отвлечений. Сосредоточьтесь на важном!</p>
    <div class="sites">
      <h3>Заблокированные сайты:</h3>
      <div class="site">📺 YouTube</div>
      <div class="site">💬 Telegram Web</div>
      <div class="site">📱 WhatsApp Web</div>
    </div>
  </div>
</body>
</html>
